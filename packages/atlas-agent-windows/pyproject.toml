[project]
name = "atlas-agent-windows"
version = "0.1.0"
description = "ATLAS Windows Agent: local executor and outbound transport"
requires-python = ">=3.12,<3.13"
dependencies = [
    "atlas-shared",
    "websockets>=13.1",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.scripts]
atlas-agent = "atlas_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_agent"]

[tool.uv.sources]
atlas-shared = { workspace = true }
