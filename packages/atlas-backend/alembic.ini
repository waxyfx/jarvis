[alembic]
# %(here)s keeps these resolvable no matter which directory alembic is invoked
# from, so CI, the runbook and a developer shell all behave the same.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# The URL is read from ATLAS_DATABASE_URL in migrations/env.py, so that
# migrations and the application can never disagree about which database
# they are pointed at.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
