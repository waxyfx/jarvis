[project]
name = "atlas-backend"
version = "0.1.0"
description = "ATLAS backend: realtime hub, device identity, audit, persistence"
requires-python = ">=3.12,<3.13"
dependencies = [
    "atlas-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Declared rather than inherited. It arrives anyway through fastapi and
    # pydantic-settings, and eight modules here import it directly — which is
    # fine until one of those drops it or pins a major version, and then the
    # break lands in a container on a host with nobody watching.
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "structlog>=24.4",
    "httpx>=0.27",
    # Windows ships no IANA time zone database, so `ZoneInfo("Asia/Almaty")`
    # raises there - which, since the proactive rules and the prayer schedule
    # both resolve a zone at startup, would take the whole backend down on the
    # machine it is meant to run on. Found by a test, before it was found by
    # the owner.
    "tzdata>=2025.2",
]

[project.scripts]
atlas-backend = "atlas_backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_backend"]

[tool.uv.sources]
atlas-shared = { workspace = true }
