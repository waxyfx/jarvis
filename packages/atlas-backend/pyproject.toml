[project]
name = "atlas-backend"
version = "0.1.0"
description = "ATLAS backend: realtime hub, device identity, audit, persistence"
requires-python = ">=3.12,<3.13"
dependencies = [
    "atlas-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "structlog>=24.4",
]

[project.scripts]
atlas-backend = "atlas_backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_backend"]

[tool.uv.sources]
atlas-shared = { workspace = true }
