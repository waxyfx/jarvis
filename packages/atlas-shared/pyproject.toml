[project]
name = "atlas-shared"
version = "0.1.0"
description = "ATLAS shared contracts: wire protocol, cryptography, tool manifests"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "cryptography>=43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_shared"]
