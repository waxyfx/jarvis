# ATLAS deployment for a single-user VPS.
#
# NOT YET VERIFIED: written but never run — Docker is not installed on the
# development machine. See docs/runbook.md for the first-deployment checklist.
#
#   docker compose --env-file ../.env up -d
name: atlas

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Deliberately no `ports:` — the database is reachable only from the
    # compose network, never from the internet.

  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      ATLAS_DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    # Also no `ports:` — Caddy is the only way in, so TLS cannot be bypassed.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ATLAS_DOMAIN: ${ATLAS_DOMAIN:?set ATLAS_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
